version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bugtracking-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugtracking-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bug_tracking_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: buguser
      SPRING_DATASOURCE_PASSWORD: bugpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: bugtracking-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bug_tracking_system
      MYSQL_USER: buguser
      MYSQL_PASSWORD: bugpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

volumes:
  db_data:
