<div class="container mt-5 col-md-6">
  <div class="card shadow-sm p-4">
    <h4 class="text-center mb-3 text-primary fw-bold">🎫 Raise New Ticket</h4>

    <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()">
      <!-- Title -->
      <div class="mb-3">
        <label for="title" class="form-label fw-semibold">Title</label>
        <input
          type="text"
          id="title"
          formControlName="title"
          class="form-control"
          placeholder="Enter ticket title"
        />
        <div
          *ngIf="ticketForm.get('title')?.invalid && ticketForm.get('title')?.touched"
          class="text-danger small"
        >
          Title is required (min 3 characters)
        </div>
      </div>

      <!-- Description -->
      <div class="mb-3">
        <label for="description" class="form-label fw-semibold">Description</label>
        <textarea
          id="description"
          formControlName="description"
          rows="4"
          class="form-control"
          placeholder="Describe the issue in detail"
        ></textarea>
        <div
          *ngIf="ticketForm.get('description')?.invalid && ticketForm.get('description')?.touched"
          class="text-danger small"
        >
          Description is required (min 10 characters)
        </div>
      </div>

      <!-- No Assignee -->
      <div class="alert alert-info small">
        <strong>Note:</strong> You cannot assign the ticket. Admin will assign it to a developer
        after review.
      </div>

      <!-- Buttons -->
      <div class="text-center">
        <button
          type="submit"
          class="btn btn-success px-4"
          [disabled]="isSubmitting || ticketForm.invalid"
        >
          {{ isSubmitting ? 'Submitting...' : 'Raise Ticket' }}
        </button>
        <button type="button" class="btn btn-secondary ms-2 px-4" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
