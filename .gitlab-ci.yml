stages:
  - build
  - deploy

variables:
  DOCKER_REGISTRY: docker.io/tejosaran # 👈 Replace with your Docker Hub username
  FRONTEND_IMAGE: $DOCKER_REGISTRY/bugtrackingsystem-frontend
  BACKEND_IMAGE: $DOCKER_REGISTRY/bugtrackingsystem-backend

# ---------- COMMON LOGIN ----------
before_script:
  - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

# ---------- BUILD & PUSH FRONTEND ----------
build_and_push_frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "🚀 Building Angular Frontend Docker image..."
    - docker build -t $FRONTEND_IMAGE:latest ./frontend
    - echo "📤 Pushing Frontend image to Docker Hub..."
    - docker push $FRONTEND_IMAGE:latest
  only:
    - main

# ---------- BUILD & PUSH BACKEND ----------
build_and_push_backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "🚀 Building Spring Boot Backend Docker image..."
    - docker build -t $BACKEND_IMAGE:latest ./backend
    - echo "📤 Pushing Backend image to Docker Hub..."
    - docker push $BACKEND_IMAGE:latest
  only:
    - main

# ---------- DEPLOY TO EC2 ----------
deploy_to_ec2:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
  script:
    - echo "🚀 Deploying latest version to EC2..."
    - ssh $EC2_USER@$EC2_HOST "
      cd /path/to/BugTrackingSystem &&
      git pull origin main &&
      docker-compose down &&
      docker-compose pull &&
      docker-compose up -d --build
      "
  environment:
    name: production
    url: http://$EC2_HOST
  only:
    - main
