stages:
  - build
  - deploy

variables:
  # DOCKER_REGISTRY: "docker.io"
  DOCKER_IMAGE_BACKEND: "$DOCKER_REGISTRY/$DOCKERHUB_USERNAME/backend"
  DOCKER_IMAGE_FRONTEND: "$DOCKER_REGISTRY/$DOCKERHUB_USERNAME/frontend"

# ---------- BUILD & PUSH IMAGES ----------
build_and_push:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "🔐 Logging into Docker Hub..."
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin $DOCKER_REGISTRY
  script:
    - echo "🚧 Building Backend Docker Image..."
    - docker build -t $DOCKER_IMAGE_BACKEND:latest ./backend
    - echo "📤 Pushing Backend Image to Docker Hub..."
    - docker push $DOCKER_IMAGE_BACKEND:latest

    - echo "🚧 Building Frontend Docker Image..."
    - docker build -t $DOCKER_IMAGE_FRONTEND:latest ./frontend
    - echo "📤 Pushing Frontend Image to Docker Hub..."
    - docker push $DOCKER_IMAGE_FRONTEND:latest

  only:
    - main

# ---------- DEPLOY TO EC2 ----------
deploy_to_ec2:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo "🔍 Checking EC2 host reachability..."
    - ping -c 2 $EC2_HOST || echo "⚠️ Unable to ping EC2"
    - echo "🔑 Attempting to fetch SSH key..."
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts || (echo "❌ SSH keyscan failed!" && exit 1)
  script:
    - echo "🚀 Deploying application to EC2..."
    - |
      ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "
        cd /home/ubuntu/BugTrackingSystem &&
        docker-compose down &&
        docker-compose pull &&
        docker-compose up -d --build
      "
  environment:
    name: production
    url: http://$EC2_HOST
  only:
    - main
