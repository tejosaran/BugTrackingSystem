stages:
  - build
  - push
  - deploy

variables:
  FRONTEND_IMAGE: $DOCKER_REGISTRY/frontend
  BACKEND_IMAGE: $DOCKER_REGISTRY/backend

# ---------- COMMON: Authenticate Docker Hub ----------
before_script:
  - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

# ---------- STAGE 1: Build Frontend ----------
build_frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Building Angular Frontend Docker image..."
    - docker build -t $FRONTEND_IMAGE:latest ./frontend
  only:
    - main

# ---------- STAGE 2: Build Backend ----------
build_backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Building Spring Boot Backend Docker image..."
    - docker build -t $BACKEND_IMAGE:latest ./backend
  only:
    - main

# ---------- STAGE 3: Push to Docker Hub ----------
push_images:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Pushing images to Docker Hub..."
    - docker push $FRONTEND_IMAGE:latest
    - docker push $BACKEND_IMAGE:latest
  only:
    - main

# ---------- STAGE 4: Deploy to EC2 ----------
deploy_to_ec2:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Deploying application on EC2..."
    - ssh $EC2_USER@$EC2_HOST "
      cd /path/to/BugTrackingSystem &&
      docker-compose down &&
      docker-compose pull &&
      docker-compose up -d --build
      "
  environment:
    name: production
    url: http://$EC2_HOST
  only:
    - main
