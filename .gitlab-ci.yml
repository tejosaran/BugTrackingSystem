stages:
  - build
  - push
  - deploy

variables:
  # Docker image names
  DOCKER_IMAGE_BACKEND: "$DOCKER_USERNAME/backend"
  DOCKER_IMAGE_FRONTEND: "$DOCKER_USERNAME/frontend"

# Main pipeline job
build_and_push:
  stage: build-and-push
  image: docker:latest
  services:
    - docker:dind

  before_script:
    - echo "Logging into Docker Hub..."
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin $DOCKER_REGISTRY

  script:
    - echo "============================="
    - echo "Building backend Docker image"
    - echo "============================="
    - docker build -t $DOCKER_IMAGE_BACKEND:latest ./trackVest-backend

    - echo "Pushing backend image to Docker Hub..."
    - docker push $DOCKER_IMAGE_BACKEND:latest

    - echo "============================="
    - echo "Building frontend Docker image"
    - echo "============================="
    - docker build -t $DOCKER_IMAGE_FRONTEND:latest ./trackVest-frontend

    - echo "Pushing frontend image to Docker Hub..."
    - docker push $DOCKER_IMAGE_FRONTEND:latest

  only:
    - main
# ---------- STAGE 4: Deploy to EC2 ----------
deploy_to_ec2:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Deploying application on EC2..."
    - ssh $EC2_USER@$EC2_HOST "
      cd /path/to/BugTrackingSystem &&
      docker-compose down &&
      docker-compose pull &&
      docker-compose up -d --build
      "
  environment:
    name: production
    url: http://$EC2_HOST
  only:
    - main
